services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitpro
      POSTGRES_USER: fitpro
      POSTGRES_PASSWORD: fitpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fitpro" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgres://fitpro:fitpro@postgres:5432/fitpro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://fitpro:fitpro@postgres:5432/fitpro
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_URL_INTERNAL: http://backend:8000/api/v1
      # Required on Windows: Next.js can't detect file changes via inotify
      # across the Windows→Linux boundary, so we use polling instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app          # mount source for live edits
      - /app/node_modules        # keep Linux node_modules inside container
      - /app/.next               # keep build cache inside container

volumes:
  postgres_data:
